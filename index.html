<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Now Playing — Nosotros</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>

/* ============================================================
   CONFIGURA AQUÍ TU CONTENIDO
   1. --photo-url        -> URL o ruta de tu foto principal (portada por defecto)
   2. TRACKS (abajo en el <script>) -> tus canciones
   ============================================================ */

:root{
  --photo-url: url("mel 2.jpeg");

  --bg-a: #0b0a0c;
  --bg-b: #141014;
  --bg-c: #1a1116;
  --card: rgba(24,20,23,0.72);
  --ink: #f7ecf1;
  --ink-dim: #b98fa4;
  --accent: #ff9fbb;
  --accent-deep: #ff6f9c;
  --accent-soft: #ffc2d6;
  --lilac: #d6a8e0;
  --track: #35262e;
  --white: #201a1e;
}

*{box-sizing:border-box; margin:0; padding:0;}

html,body{
  height:100%;
  font-family:'Nunito', sans-serif;
  color:var(--ink);
  overflow:hidden;
}

body{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  min-height:100vh;
  padding:20px;
  background: linear-gradient(160deg, var(--bg-a) 0%, var(--bg-b) 45%, var(--bg-c) 100%);
}

/* Fondo ambiental: la misma foto, gigante, desenfocada y oscurecida */
.ambient{
  position:fixed;
  inset:-10%;
  background-image: var(--photo-url);
  background-size:cover;
  background-position:center;
  filter: blur(80px) saturate(1.3) brightness(0.65);
  transform: scale(1.15);
  z-index:0;
  opacity:0.65;
  transition: filter 1.2s ease, opacity 1.2s ease;
}
.ambient::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(180deg, rgba(11,10,12,.55) 0%, rgba(11,10,12,.92) 100%);
}
body.is-playing .ambient{ filter: blur(90px) saturate(1.6) brightness(0.75); opacity:0.8; }

/* burbujas decorativas flotantes: brillitos rosa sobre el negro */
.bubble{
  position:fixed;
  border-radius:50%;
  background: radial-gradient(circle at 35% 35%, rgba(255,190,210,0.9), rgba(255,111,156,0.15) 70%, transparent 100%);
  filter: blur(3px);
  opacity:0.55;
  z-index:0;
  animation: float 9s ease-in-out infinite;
}
.bubble.b1{ width:80px; height:80px; top:8%; left:10%; animation-delay:0s; }
.bubble.b2{ width:50px; height:50px; top:70%; left:8%; animation-delay:2s; background: radial-gradient(circle at 35% 35%, rgba(214,168,224,0.9), rgba(214,168,224,0.12) 70%, transparent 100%); }
.bubble.b3{ width:64px; height:64px; top:15%; right:8%; animation-delay:1s; background: radial-gradient(circle at 35% 35%, rgba(255,159,187,0.85), rgba(255,159,187,0.12) 70%, transparent 100%); }
.bubble.b4{ width:36px; height:36px; bottom:10%; right:12%; animation-delay:3s; }
@keyframes float{
  0%,100%{ transform: translateY(0) translateX(0); }
  50%{ transform: translateY(-18px) translateX(8px); }
}

/* Corazoncitos que suben flotando todo el tiempo, sutil */
.floaty-heart{
  position:fixed;
  bottom:-40px;
  font-size:14px;
  color: var(--accent-soft);
  opacity:0;
  z-index:1;
  animation: rise 11s linear infinite;
  filter: drop-shadow(0 0 6px rgba(255,159,187,0.5));
}
.floaty-heart:nth-child(5){ left:15%; font-size:12px; animation-delay:0s; animation-duration:12s; }
.floaty-heart:nth-child(6){ left:80%; font-size:16px; animation-delay:3s; animation-duration:10s; }
.floaty-heart:nth-child(7){ left:50%; font-size:10px; animation-delay:6s; animation-duration:13s; }
.floaty-heart:nth-child(8){ left:30%; font-size:13px; animation-delay:8.5s; animation-duration:11.5s; }
@keyframes rise{
  0%{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
  10%{ opacity:0.65; }
  85%{ opacity:0.5; }
  100%{ transform: translateY(-100vh) translateX(30px) rotate(25deg); opacity:0; }
}

/* Aro de luz que rota lentamente alrededor de la tarjeta */
.glow-ring{
  position:relative;
  z-index:2;
  width:100%;
  max-width:360px;
}
.glow-ring::before{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:38px;
  padding:3px;
  background: conic-gradient(from var(--angle,0deg), var(--accent-deep), var(--lilac), var(--accent), var(--accent-deep));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  opacity:0.85;
  filter: blur(0.5px);
  animation: spin 6s linear infinite;
  z-index:0;
}
.glow-ring::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius:38px;
  background: conic-gradient(from var(--angle,0deg), var(--accent-deep), var(--lilac), var(--accent), var(--accent-deep));
  filter: blur(22px);
  opacity:0.45;
  z-index:-1;
  animation: spin 6s linear infinite;
}
body.is-playing .glow-ring::after{ opacity:0.65; filter: blur(28px); }
@property --angle{
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}
@keyframes spin{
  to{ --angle: 360deg; }
}

/* Tarjeta principal - estilo iOS, más grande */
.player{
  position:relative;
  z-index:2;
  width:100%;
  background: var(--card);
  backdrop-filter: blur(22px) saturate(1.6);
  -webkit-backdrop-filter: blur(22px) saturate(1.6);
  border-radius:32px;
  padding:28px 24px 22px;
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  animation: cardIn 0.9s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes cardIn{
  0%{ opacity:0; transform: scale(0.85) translateY(30px); }
  100%{ opacity:1; transform: scale(1) translateY(0); }
}

.eyebrow{
  display:flex;
  align-items:center;
  gap:9px;
  font-family:'Quicksand', sans-serif;
  font-weight:700;
  font-size:0.72rem;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--accent-deep);
  margin-bottom:16px;
}

/* Ecualizador: barras que solo se mueven mientras suena */
.eq{ display:flex; align-items:flex-end; gap:3px; height:14px; }
.eq span{
  width:3.5px;
  background: linear-gradient(180deg, var(--accent), var(--lilac));
  border-radius:3px;
  height:3px;
  box-shadow: 0 0 6px rgba(255,159,187,0.6);
}
body.is-playing .eq span{ animation: bounce 0.9s ease-in-out infinite; }
.eq span:nth-child(1){ animation-delay: 0s; }
.eq span:nth-child(2){ animation-delay: 0.15s; }
.eq span:nth-child(3){ animation-delay: 0.3s; }
.eq span:nth-child(4){ animation-delay: 0.45s; }
@keyframes bounce{
  0%,100%{ height:3px; }
  50%{ height:14px; }
}

/* Portada = su foto, cuadrada, con brillo pulsante detrás */
.cover-stage{
  position:relative;
  margin-bottom:24px;
}
.cover-glow{
  position:absolute;
  inset:6%;
  border-radius:50%;
  background: radial-gradient(circle, rgba(255,159,187,0.55), transparent 70%);
  filter: blur(30px);
  opacity:0.5;
  z-index:0;
  transition: opacity 0.6s ease;
}
body.is-playing .cover-glow{ opacity:0.9; animation: pulseGlow 2.4s ease-in-out infinite; }
@keyframes pulseGlow{
  0%,100%{ transform: scale(1); opacity:0.7; }
  50%{ transform: scale(1.12); opacity:1; }
}
.cover-wrap{
  position:relative;
  width:100%;
  aspect-ratio: 5 / 6;
  border-radius:24px;
  overflow:hidden;
  box-shadow: 0 18px 36px rgba(0,0,0,0.55);
  border: 3px solid rgba(255,159,187,0.35);
  z-index:1;
  transition: transform 0.4s ease, box-shadow 0.4s ease;
}
.cover-wrap:hover{
  transform: scale(1.02) rotate(-0.6deg);
  box-shadow: 0 24px 55px rgba(255,111,156,0.35);
}
.cover{
  width:100%; height:100%;
  background-image: var(--photo-url);
  background-size:cover;
  background-position:center;
  transform: scale(1.02);
  transition: transform 8s ease;
}
body.is-playing .cover{ transform: scale(1.1); }

.cover-wrap::after{
  content:"";
  position:absolute; inset:0;
  background: linear-gradient(180deg, transparent 55%, rgba(255,92,138,0.3) 100%);
}

/* Info de la "canción" */
.meta{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:22px;
}
.meta-text h1{
  font-family:'Quicksand', sans-serif;
  font-size:1.3rem;
  font-weight:700;
  letter-spacing:-0.2px;
  margin-bottom:4px;
  color:var(--ink);
  line-height:1.2;
}
.meta-text p{
  font-size:0.95rem;
  color:var(--accent-deep);
  font-weight:600;
}
.like-btn{
  position:relative;
  background:var(--white);
  border:none; cursor:pointer;
  color:var(--accent-soft);
  font-size:1.35rem;
  line-height:1;
  width:44px; height:44px;
  flex-shrink:0;
  border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  box-shadow: 0 8px 20px rgba(255,111,156,0.3);
  transition: transform 0.25s ease, color 0.25s ease;
}
.like-btn.liked{ color:var(--accent-deep); transform: scale(1.15); }
.like-btn:active{ transform: scale(0.9); }

/* Barra de progreso */
.progress-row{ margin-bottom:18px; }
.bar{
  position:relative;
  width:100%;
  height:6px;
  background:var(--track);
  border-radius:99px;
  cursor:pointer;
}
.bar-fill{
  position:absolute; left:0; top:0; bottom:0;
  width:0%;
  background: linear-gradient(90deg, var(--lilac), var(--accent-deep));
  border-radius:99px;
  box-shadow: 0 0 10px rgba(255,111,156,0.55);
}
.bar-knob{
  position:absolute; top:50%; left:0%;
  width:15px; height:15px;
  background:#fff; border-radius:50%;
  transform: translate(-50%, -50%) scale(0);
  transition: transform 0.15s ease;
  box-shadow: 0 3px 10px rgba(255,92,138,0.6);
  border: 2px solid var(--accent-deep);
}
.bar:hover .bar-knob{ transform: translate(-50%, -50%) scale(1); }

.time-row{
  display:flex; justify-content:space-between;
  font-size:0.75rem; color:var(--ink-dim);
  margin-top:8px;
  font-variant-numeric: tabular-nums;
  font-weight:600;
}

/* Controles */
.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin-top:8px;
}
.ctrl-btn{
  background:none; border:none; cursor:pointer;
  color:var(--accent-soft);
  transition: color 0.2s ease, transform 0.15s ease;
}
.ctrl-btn:hover{ color:var(--accent-deep); transform: scale(1.1); }
.ctrl-btn svg{ width:21px; height:21px; display:block; }

.play-btn{
  width:56px; height:56px;
  border-radius:50%;
  background: linear-gradient(135deg, var(--accent) 0%, var(--accent-deep) 55%, var(--lilac) 100%);
  color: #fff;
  display:flex; align-items:center; justify-content:center;
  border:none; cursor:pointer;
  box-shadow: 0 14px 32px rgba(255,92,138,0.5);
  transition: transform 0.15s ease, box-shadow 0.2s ease;
}
.play-btn:hover{ transform: scale(1.07); }
.play-btn:active{ transform: scale(0.94); }
.play-btn svg{ width:22px; height:22px; }

/* Botón y panel de lista de canciones */
.queue-row{
  display:flex;
  justify-content:center;
  margin-top:18px;
}
.queue-wrap{ position:relative; }
.queue-btn{
  display:flex;
  align-items:center;
  gap:7px;
  background: rgba(255,159,187,0.1);
  border:1px solid rgba(255,159,187,0.25);
  border-radius:99px;
  padding:9px 18px;
  cursor:pointer;
  color:var(--accent-soft);
  font-family:'Nunito', sans-serif;
  font-size:0.82rem;
  font-weight:700;
  letter-spacing:0.2px;
  transition: color 0.2s ease, background 0.2s ease, transform 0.15s ease;
}
.queue-btn:hover{ color:var(--accent-deep); background: rgba(255,159,187,0.18); transform: translateY(-1px); }
.queue-btn.open{ color:var(--accent-deep); background: rgba(255,159,187,0.2); }
.queue-btn svg{ width:16px; height:16px; flex-shrink:0; }

.queue-panel{
  position:absolute;
  bottom:calc(100% + 12px);
  left:50%;
  transform: translateX(-50%) translateY(10px) scale(0.96);
  width:250px;
  max-height:220px;
  overflow-y:auto;
  background: rgba(20,16,19,0.92);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border:1px solid rgba(255,159,187,0.22);
  border-radius:18px;
  padding:10px;
  box-shadow: 0 18px 40px rgba(0,0,0,0.55);
  opacity:0;
  pointer-events:none;
  transition: opacity 0.2s ease, transform 0.2s ease;
  z-index:20;
}
.queue-panel.show{
  opacity:1;
  transform: translateX(-50%) translateY(0) scale(1);
  pointer-events:auto;
}
.queue-title{
  font-family:'Quicksand', sans-serif;
  font-size:0.68rem;
  font-weight:700;
  letter-spacing:1px;
  text-transform:uppercase;
  color:var(--ink-dim);
  padding:4px 8px 8px;
}
.queue-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:9px 8px;
  border-radius:12px;
  cursor:pointer;
  transition: background 0.15s ease;
}
.queue-item:hover{ background: rgba(255,159,187,0.1); }
.queue-item.active{ background: rgba(255,111,156,0.18); }
.queue-dot{
  width:7px; height:7px; border-radius:50%;
  background: var(--track);
  flex-shrink:0;
}
.queue-item.active .queue-dot{
  background: var(--accent-deep);
  box-shadow: 0 0 6px var(--accent-deep);
}
.queue-text{ overflow:hidden; }
.queue-text .qt-title{
  font-size:0.85rem; font-weight:700; color:var(--ink);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.queue-text .qt-artist{
  font-size:0.72rem; color:var(--ink-dim);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Nota inferior */
.footer-note{
  text-align:center;
  margin-top:18px;
  font-size:0.74rem;
  color:var(--ink-dim);
  letter-spacing:0.2px;
  font-weight:600;
}
.footer-note strong{ color:var(--accent-deep); }

/* Corazones que estallan al dar like */
.burst-heart{
  position:fixed;
  pointer-events:none;
  z-index:999;
  font-size:18px;
  color:var(--accent-deep);
}

@media (max-width:420px){
  .player{ padding:26px 20px 20px; border-radius:30px; }
  .meta-text h1{ font-size:1.3rem; }
}
</style>
</head>
<body>

<div class="ambient"></div>
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>
<div class="bubble b4"></div>
<span class="floaty-heart">💗</span>
<span class="floaty-heart">💕</span>
<span class="floaty-heart">💗</span>
<span class="floaty-heart">💕</span>

<div class="glow-ring">
  <div class="player" id="player">

    <div class="eyebrow">
      <div class="eq"><span></span><span></span><span></span><span></span></div>
      <span id="statusLabel">En pausa</span>
    </div>

    <div class="cover-stage">
      <div class="cover-glow"></div>
      <div class="cover-wrap">
        <div class="cover"></div>
      </div>
    </div>

    <div class="meta">
      <div class="meta-text">
        <h1 id="songTitle">Me Gusta Todo de Usted</h1>
        <p id="songArtist">Fer &amp; Mel</p>
      </div>
      <button class="like-btn" id="likeBtn" title="Me encanta">♡</button>
    </div>

    <div class="progress-row">
      <div class="bar" id="bar">
        <div class="bar-fill" id="barFill"></div>
        <div class="bar-knob" id="barKnob"></div>
      </div>
      <div class="time-row">
        <span id="curTime">0:00</span>
        <span id="durTime">0:00</span>
      </div>
    </div>

    <div class="controls">
      <button class="ctrl-btn" id="backBtn" title="Reiniciar">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <button class="play-btn" id="playBtn" title="Reproducir">
        <svg id="playIcon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pauseIcon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>

      <button class="ctrl-btn" id="fwdBtn" title="Adelantar 10s">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
    </div>

    <div class="queue-row">
      <div class="queue-wrap">
        <button class="queue-btn" id="queueBtn" title="Elegir canción">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h12v2H4V6zm0 5h12v2H4v-2zm0 5h8v2H4v-2zm12.5-8.5v7.09A2.5 2.5 0 1 0 18 16.6V9h2V7h-3.5z"/></svg>
          <span>Escoge tu canción</span>
        </button>
        <div class="queue-panel" id="queuePanel">
          <div class="queue-title">Nuestras canciones</div>
          <div id="queueList"></div>
        </div>
      </div>
    </div>

    <p class="footer-note">Sonando desde el corazón de <strong>Fer</strong> 💕</p>

    <audio id="audio" preload="metadata"></audio>

  </div>
</div>

<script>
/* ===================== CONFIGURA TUS CANCIONES =====================
   Agrega, quita o edita canciones aquí. Cada una necesita:
   - title  -> nombre que se muestra
   - artist -> texto debajo del título (ej. "Fer & Mel")
   - src    -> nombre EXACTO del archivo mp3 (debe estar subido en la
               misma carpeta que este HTML, respeta mayúsculas/minúsculas)
   - photo  -> (opcional) si quieres una foto distinta para esa canción.
               Si lo dejas vacío "", usa la foto principal de arriba.

   IMPORTANTE: si una canción "no suena" al elegirla, casi siempre es
   porque el archivo mp3 todavía no está subido en la misma carpeta,
   o el nombre no coincide exactamente (revisa mayúsculas, espacios
   y tildes). Este archivo ahora te avisa en pantalla si eso pasa.
   ==================================================================== */
const TRACKS = [
  {
    title: "Me Gusta Todo de Usted",
    artist: "Fer & Mel",
    src: "Me Gusta Todo De Tí - Banda El Recodo (Me Gusta Todo De Ti).mp3",
    photo: "mel 2.jpeg"
  },
  {
    title: "100 Años con Usted Mel",
    artist: "Fer & Mel",
    src: "cien.mp3",
    photo: "foto git.jpeg"
  }
  // Agrega más así:
  // { title: "Otra canción", artist: "Fer & Mel", src: "otra.mp3", photo: "" },
];

const DEFAULT_PHOTO = getComputedStyle(document.documentElement).getPropertyValue('--photo-url').trim();

let currentIndex = 0;

const audio = document.getElementById('audio');
const songTitleEl = document.getElementById('songTitle');
const songArtistEl = document.getElementById('songArtist');
const queueBtn = document.getElementById('queueBtn');
const queuePanel = document.getElementById('queuePanel');
const queueList = document.getElementById('queueList');
const body = document.body;
const playBtn = document.getElementById('playBtn');
const playIcon = document.getElementById('playIcon');
const pauseIcon = document.getElementById('pauseIcon');
const statusLabel = document.getElementById('statusLabel');
const bar = document.getElementById('bar');
const barFill = document.getElementById('barFill');
const barKnob = document.getElementById('barKnob');
const curTime = document.getElementById('curTime');
const durTime = document.getElementById('durTime');
const likeBtn = document.getElementById('likeBtn');
const backBtn = document.getElementById('backBtn');
const fwdBtn = document.getElementById('fwdBtn');

function fmt(sec){
  if(!isFinite(sec)) return "0:00";
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function setPlayingUI(playing){
  body.classList.toggle('is-playing', playing);
  playIcon.style.display = playing ? 'none' : 'block';
  pauseIcon.style.display = playing ? 'block' : 'none';
  if(!audio.error){
    statusLabel.textContent = playing ? 'Sonando ahora' : 'En pausa';
  }
}

function loadTrack(index, autoplay){
  currentIndex = index;
  const track = TRACKS[index];
  songTitleEl.textContent = track.title;
  songArtistEl.textContent = track.artist;
  audio.src = encodeURI(track.src);
  audio.load();
  document.documentElement.style.setProperty('--photo-url', track.photo ? `url("${track.photo}")` : DEFAULT_PHOTO);
  renderQueue();
  barFill.style.width = '0%';
  barKnob.style.left = '0%';
  curTime.textContent = '0:00';
  durTime.textContent = '0:00';
  if(autoplay){
    statusLabel.textContent = 'Cargando "' + track.title + '"...';
    const tryPlay = () => {
      const playPromise = audio.play();
      if(playPromise !== undefined){
        playPromise.catch(() => {
          statusLabel.textContent = 'No se pudo reproducir "' + track.title + '"';
        });
      }
    };
    // Espera a que el archivo esté realmente listo antes de reproducir,
    // así se evita el error de "carrera" entre load() y play().
    audio.addEventListener('canplay', tryPlay, { once: true });
  }
}

function renderQueue(){
  queueList.innerHTML = "";
  TRACKS.forEach((track, i) => {
    const item = document.createElement('div');
    item.className = 'queue-item' + (i === currentIndex ? ' active' : '');
    item.innerHTML = `
      <div class="queue-dot"></div>
      <div class="queue-text">
        <div class="qt-title">${track.title}</div>
        <div class="qt-artist">${track.artist}</div>
      </div>
    `;
    item.addEventListener('click', () => {
      loadTrack(i, true);
      closeQueue();
    });
    queueList.appendChild(item);
  });
}

function toggleQueue(){
  queuePanel.classList.toggle('show');
  queueBtn.classList.toggle('open');
}
function closeQueue(){
  queuePanel.classList.remove('show');
  queueBtn.classList.remove('open');
}
queueBtn.addEventListener('click', (e) => { e.stopPropagation(); toggleQueue(); });
document.addEventListener('click', (e) => {
  if(!queuePanel.contains(e.target) && e.target !== queueBtn){ closeQueue(); }
});

playBtn.addEventListener('click', () => {
  if(audio.paused){
    const playPromise = audio.play();
    if(playPromise !== undefined){
      playPromise.catch(() => {
        statusLabel.textContent = 'No se pudo reproducir esta canción';
      });
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener('play', () => setPlayingUI(true));
audio.addEventListener('pause', () => setPlayingUI(false));
audio.addEventListener('ended', () => {
  const nextIndex = (currentIndex + 1) % TRACKS.length;
  loadTrack(nextIndex, true);
});
audio.addEventListener('error', () => {
  let msg = 'No se pudo cargar el archivo de audio';
  const err = audio.error;
  if(err){
    if(err.code === err.MEDIA_ERR_SRC_NOT_SUPPORTED){
      msg = 'Archivo no encontrado o formato no soportado: revisa el nombre del mp3';
    } else if(err.code === err.MEDIA_ERR_NETWORK){
      msg = 'Error de conexión al cargar el mp3';
    } else if(err.code === err.MEDIA_ERR_DECODE){
      msg = 'El archivo mp3 está dañado o no se pudo procesar';
    }
  }
  statusLabel.textContent = msg;
  setPlayingUI(false);
});

audio.addEventListener('loadedmetadata', () => {
  durTime.textContent = fmt(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  const pct = (audio.currentTime / audio.duration) * 100 || 0;
  barFill.style.width = pct + '%';
  barKnob.style.left = pct + '%';
  curTime.textContent = fmt(audio.currentTime);
});

bar.addEventListener('click', (e) => {
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(isFinite(audio.duration)){
    audio.currentTime = pct * audio.duration;
  }
});

backBtn.addEventListener('click', () => { audio.currentTime = 0; });
fwdBtn.addEventListener('click', () => { audio.currentTime = Math.min(audio.currentTime + 10, audio.duration || 0); });

let liked = false;
likeBtn.addEventListener('click', () => {
  liked = !liked;
  likeBtn.classList.toggle('liked', liked);
  likeBtn.textContent = liked ? '♥' : '♡';
  if(liked){ burstHearts(); }
});

function burstHearts(){
  const rect = likeBtn.getBoundingClientRect();
  const originX = rect.left + rect.width / 2;
  const originY = rect.top + rect.height / 2;
  for(let i = 0; i < 12; i++){
    const h = document.createElement('div');
    h.className = 'burst-heart';
    h.textContent = Math.random() > 0.5 ? '💕' : '💗';
    h.style.left = originX + 'px';
    h.style.top = originY + 'px';
    document.body.appendChild(h);
    const angle = Math.random() * Math.PI * 2;
    const dist = 60 + Math.random() * 90;
    h.animate([
      { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
      { transform: `translate(calc(-50% + ${Math.cos(angle)*dist}px), calc(-50% + ${Math.sin(angle)*dist}px)) scale(1.2)`, opacity: 0 }
    ], { duration: 1300, easing: 'ease-out' });
    setTimeout(() => h.remove(), 1300);
  }
}

// Carga la primera canción al abrir la página (sin reproducir automáticamente)
loadTrack(0, false);
</script>
</body>
</html>
